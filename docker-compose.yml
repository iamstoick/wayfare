services:
  db:
    image: postgis/postgis:15-3.3
    container_name: travel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: travel_planner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: travel_api
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/travel_planner?schema=public"
      PORT: 5000
      JWT_SECRET: "${JWT_SECRET:-dev_jwt_secret_change_me}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:5001/api}"
        VITE_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
    container_name: travel_web
    restart: unless-stopped
    ports:
      - "4445:80"
    depends_on:
      - api

volumes:
  pgdata:
